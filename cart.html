<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة المتحدة | سلة المشتريات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --secondary: #0f172a;
      --accent: #f59e0b;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-light); color: var(--secondary); display: flex; flex-direction: column; min-height: 100vh; }

    header { background: #fff; border-bottom: 1.5px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    
    .logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .logo-box { width: 44px; height: 44px; background: linear-gradient(135deg, #0284c7, #0369a1); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .logo-box svg { width: 24px; height: 24px; fill: #fbbf24; }
    .brand-title { font-size: 1.45rem; font-weight: 900; color: var(--secondary); }
    .brand-title span { color: #f59e0b; }

    .nav-links a { text-decoration: none; color: var(--secondary); font-weight: 700; font-size: 0.95rem; }

    .main-wrap { max-width: 1100px; margin: 30px auto 60px; padding: 0 20px; flex: 1; width: 100%; }
    .page-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 24px; color: var(--secondary); }

    .cart-grid { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 30px; }
    @media (max-width: 860px) { .cart-grid { grid-template-columns: 1fr; } }

    .cart-items { background: #fff; border-radius: 16px; border: 1px solid var(--border-color); padding: 20px; }
    .cart-item { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border-color); }
    .cart-item:last-child { border-bottom: none; }
    .cart-item img { width: 75px; height: 75px; object-fit: contain; border-radius: 8px; background: #f8fafc; border: 1px solid #f1f5f9; padding: 4px; }
    
    .item-details { flex: 1; }
    .item-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .item-price { font-size: 0.95rem; color: var(--text-muted); font-weight: 600; }

    .qty-controls { display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .qty-btn { background: #f8fafc; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; font-size: 1rem; }
    .qty-num { padding: 6px 12px; font-weight: 700; min-width: 32px; text-align: center; }

    .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: 700; font-size: 0.85rem; padding: 4px 8px; }

    .checkout-card { background: #fff; border-radius: 16px; border: 1px solid var(--border-color); padding: 24px; height: fit-content; }
    .checkout-card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }

    .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1rem; color: var(--text-muted); font-weight: 600; }

    .form-group { margin-top: 14px; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 0.95rem; outline: none; }

    .submit-order-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 20px; font-family: inherit; }
    .submit-order-btn:hover { background: var(--primary-dark); }

    footer { background: #0b1526; color: #94a3b8; text-align: center; padding: 25px 20px; font-size: 0.9rem; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo-area">
        <div class="logo-box"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h8l-2 8 10-12h-8l2-8z"/></svg></div>
        <div class="brand-title">المتحدة <span>⚡</span></div>
      </a>
      <nav class="nav-links">
        <a href="index.html">← العودة للمتجر</a>
      </nav>
    </div>
  </header>

  <main class="main-wrap">
    <h1 class="page-title">سلة المشتريات ⚡</h1>
    <div id="cartContent"></div>
  </main>

  <footer>
    <p>جميع الحقوق محفوظة &copy; 2026 <strong>شركة المتحدة للتوريدات الكهربائية ⚡</strong></p>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzzEbYH7pD08B-NRUza6sALW5b593HpMYSlTlDbasoQuh-q7mRcxDcS5AvUpnP7l9FY/exec";

    function getCart() { return JSON.parse(localStorage.getItem('motaheda_cart') || '[]'); }
    function saveCart(cart) { localStorage.setItem('motaheda_cart', JSON.stringify(cart)); renderCart(); }

    function updateQty(id, delta) {
      let cart = getCart();
      const item = cart.find(i => String(i.id) === String(id));
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => String(i.id) !== String(id));
      }
      saveCart(cart);
    }

    function removeItem(id) {
      let cart = getCart().filter(i => String(i.id) !== String(id));
      saveCart(cart);
    }

    function renderCart() {
      const cart = getCart();
      const contentEl = document.getElementById('cartContent');

      if (cart.length === 0) {
        contentEl.innerHTML = `
          <div style="text-align:center; padding: 60px 20px; color: var(--text-muted);">
            <h3>سلة المشتريات فارغة</h3>
            <p style="margin-top:8px;">تفضل بزيارة قائمة منتجات المتحدة وأضف ما يلزمك من مهمات كهربائية.</p>
            <a href="index.html" style="display:inline-block; margin-top:16px; background:var(--primary); color:#fff; padding:10px 24px; border-radius:8px; text-decoration:none; font-weight:700;">تصفح المعروضات</a>
          </div>
        `;
        return;
      }

      let subtotal = 0;
      const itemsHtml = cart.map(item => {
        const itemTotal = Number(item.price) * item.qty;
        subtotal += itemTotal;
        return `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.title}">
            <div class="item-details">
              <div class="item-title">${item.title}</div>
              <div class="item-price">${item.price} ج.م × ${item.qty} = <strong>${itemTotal} ج.م</strong></div>
            </div>
            <div class="item-actions" style="display:flex; align-items:center; gap:10px;">
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                <span class="qty-num">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
              </div>
              <button class="delete-btn" onclick="removeItem('${item.id}')">حذف</button>
            </div>
          </div>
        `;
      }).join('');

      contentEl.innerHTML = `
        <div class="cart-grid">
          <div class="cart-items">${itemsHtml}</div>
          <div class="checkout-card">
            <h3>بيانات التوصيل والتأكيد</h3>
            <div class="summary-row"><span>قيمة الطلبات:</span><span>${subtotal} ج.م</span></div>
            <div class="summary-row" style="font-size:1.3rem; font-weight:800; color:var(--secondary); border-top:1.5px dashed var(--border-color); padding-top:14px; margin-top:14px;">
              <span>الإجمالي:</span><span>${subtotal} ج.م</span>
            </div>

            <form onsubmit="submitOrder(event, ${subtotal})">
              <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="custName" required placeholder="اسم المستلم"></div>
              <div class="form-group"><label>رقم التليفون:</label><input type="tel" id="custPhone" required placeholder="01xxxxxxxxx"></div>
              <div class="form-group"><label>عنوان التوصيل:</label><textarea id="custAddress" rows="2" required placeholder="المحافظة - المنطقة - الشارع"></textarea></div>
              <button type="submit" id="btnSubmit" class="submit-order-btn">تأكيد طلب التوريد ⚡</button>
            </form>
          </div>
        </div>
      `;
    }

    function submitOrder(e, total) {
      e.preventDefault();
      const cart = getCart();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "جاري تسجيل الطلب لدى المتحدة...";
      btn.disabled = true;

      const summary = cart.map(i => `${i.title} (عدد: ${i.qty})`).join(' | ');
      const payload = {
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        address: document.getElementById('custAddress').value,
        product: summary,
        price: total + " ج.م"
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("تم تسجيل طلبك بنجاح في مخازن شركة المتحدة ⚡");
        localStorage.removeItem('motaheda_cart');
        renderCart();
      })
      .catch(() => {
        alert("تم استلام الطلب وسنتواصل معك هاتفياً.");
        localStorage.removeItem('motaheda_cart');
        renderCart();
      });
    }

    renderCart();
  </script>
</body>
</html>
